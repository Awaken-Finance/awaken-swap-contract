// the version of the language, use proto3 for contracts
syntax = "proto3";

import "aelf/core.proto";
import "aelf/options.proto";
import "acs12.proto";

option csharp_namespace = "Awaken.Contracts.MockOracleContract";

service MockOracleContract {
  option (aelf.base) = "acs12.proto";
  option (aelf.csharp_state) = "Awaken.Contracts.MockOracleContract.MockOracleContractState";

  rpc SendRequest (SendRequestInput) returns (google.protobuf.Empty) {}
}

message SendRequestInput {
  int64 subscription_id = 1;
  int32 request_type_index = 2;
  bytes specific_data = 3;
  aelf.Hash trace_id = 4;
}