syntax = "proto3";

import "aelf/core.proto";
import "aelf/options.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "google/protobuf/timestamp.proto";
import "acs12.proto";

option csharp_namespace = "Awaken.Contracts.Points";

service AwakenPointsContract {
  option (aelf.csharp_state) = "Awaken.Contracts.Points.AwakenPointsContractState";
  option (aelf.base) = "acs12.proto";

  rpc Initialize (InitializeInput) returns (google.protobuf.Empty) {
  }
  rpc SetAdmin (aelf.Address) returns (google.protobuf.Empty) {
  }
  

  // View
  rpc GetAdmin (google.protobuf.Empty) returns (aelf.Address) {
    option (aelf.is_view) = true;
  }

  // points
  rpc Join(JoinInput) returns (google.protobuf.Empty) {}
  rpc AcceptReferral (AcceptReferralInput) returns (google.protobuf.Empty) {}
  rpc BatchSettle(BatchSettleInput) returns (google.protobuf.Empty) {}
  
  rpc FinishAction(FinishActionInput) returns (google.protobuf.Empty) {}
  
  rpc SetPointsContractDAppId(aelf.Hash) returns (google.protobuf.Empty) {}
  rpc SetPointsContract(aelf.Address) returns (google.protobuf.Empty) {}
  rpc SetPointsSettleAdmin (aelf.Address) returns (google.protobuf.Empty) {}
  rpc SetPointsRewardConfigList (SetPointsRewardConfigListInput) returns (google.protobuf.Empty) {}
  rpc SetOfficialDomainAlias (SetOfficialDomainAliasInput) returns (google.protobuf.Empty) {}
  rpc SetPricingToken(SetPricingTokenInput) returns (google.protobuf.Empty) {}

  rpc GetPointsContractDAppId (google.protobuf.Empty) returns (aelf.Hash){option (aelf.is_view) = true;}
  rpc GetPointsContract(google.protobuf.Empty) returns (aelf.Address) {option (aelf.is_view) = true;}
  rpc GetPointsSettleAdmin(google.protobuf.Empty) returns (aelf.Address) {option (aelf.is_view) = true;}
  rpc GetPointsRewardConfig(google.protobuf.StringValue) returns (google.protobuf.Int64Value) {option (aelf.is_view) = true;}
  rpc GetJoinRecord (aelf.Address) returns (google.protobuf.BoolValue){option (aelf.is_view) = true;}
  rpc GetOfficialDomainAlias (google.protobuf.Empty) returns (google.protobuf.StringValue) {option (aelf.is_view) = true;}
  rpc GetPricingToken(google.protobuf.StringValue) returns (google.protobuf.Empty) {}
}

// Inputs
message InitializeInput {
  aelf.Address admin = 1;
  aelf.Address points_contract_address = 2;
  aelf.Address hooks_contract_address = 3;
  aelf.Address order_contract_address = 4;
  aelf.Address points_settle_admin = 5;
  repeated PointsRewardConfig points_reward_configs = 6;
}

message JoinInput {
  string domain = 1;
  aelf.Address registrant = 2;
}

message AcceptReferralInput {
  aelf.Address referrer = 1;
  aelf.Address invitee = 2;
}

message BatchSettleInput {
  string action_name = 1;
  repeated UserPoints user_points_list = 2;
}

message FinishActionInput {
  ActionType action_type = 1;
  ActionDetail action_detail = 2;
}

message ActionDetail {
  aelf.Address address = 1;
  string symbol_a = 2;
  int64 amount_a = 3;
  string symbol_b = 4;
  int64 amount_b = 5;
}

message UserPoints {
  aelf.Address user_address = 1;
  int64 user_points = 2;
  aelf.BigIntValue user_points_value = 3;
}

message SetPointsRewardConfigListInput {
  repeated PointsRewardConfig data = 1;
}

message PointsRewardConfig {
  string action_name = 1;
  int64 first_reward_amount = 2;
  int64 proportion = 3;
}

message SetPricingTokenInput {
  repeated PricingToken pricing_tokens = 1;
}

message GetPricingTokenOutput {
  PricingToken pricing_token = 1;
}

message PricingToken {
  string symbol = 1;
  string from_symbol = 2;
  int64 from_fee_rate = 3;
}

message SetOfficialDomainAliasInput {
  string alias = 1;
}

enum ActionType {
  CommitLimitOrder = 0;
  AddLiquidity = 1;
  Swap = 2;
  LimitOrderFilled = 3;
}

//event
message Joined {
  option (aelf.is_event) = true;
  string domain = 2;
  aelf.Address registrant = 3;
}

message ReferralAccepted {
  option (aelf.is_event) = true;
  aelf.Address referrer = 1;
  aelf.Address invitee = 2;
}

